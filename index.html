<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frostbite Outpost</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#cfe3f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Frostbite">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe3f6;overscroll-behavior:none;position:fixed;width:100%;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block;touch-action:none}
  .ui{position:fixed;pointer-events:none;color:#fff;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 8px rgba(0,0,0,.25)}
  #top{top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}
  .pill{display:flex;align-items:center;gap:8px;background:rgba(18,30,48,.55);border-radius:999px;padding:6px 14px 6px 8px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:22px;letter-spacing:.5px}
  .bill{width:34px;height:22px;border-radius:5px;background:linear-gradient(#58e064,#27a838);border:2px solid #b8ffbf;box-shadow:0 2px 0 #176d22;
    display:flex;align-items:center;justify-content:center;font-size:14px;color:#0d5a1a;text-shadow:none}
  #waveBox{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);width:34%;min-width:120px;max-width:190px;text-align:center;font-size:14px}
  #waveBar{margin-top:4px;height:10px;border-radius:6px;background:rgba(18,30,48,.55);overflow:hidden;border:2px solid rgba(255,255,255,.7)}
  #waveFill{height:100%;width:0;background:linear-gradient(#ff8f5a,#ff4f3a)}
  #gear{pointer-events:auto;position:static;width:44px;height:44px;border-radius:50%;background:rgba(18,30,48,.55);display:flex;align-items:center;justify-content:center;font-size:22px;border:0;color:#fff}
  #carryBox{bottom:calc(env(safe-area-inset-bottom) + 18px);left:14px;font-size:20px;display:flex;align-items:center;gap:8px}
  #carry.full{color:#ffb347}
  #hpWrap{bottom:calc(env(safe-area-inset-bottom) + 20px);right:14px;width:34%;max-width:170px;height:16px;border-radius:9px;background:rgba(18,30,48,.55);border:2px solid #fff;overflow:hidden;opacity:0;transition:opacity .2s}
  #hpFill{height:100%;width:100%;background:linear-gradient(#ff7a7a,#e02e2e)}
  #hint{top:calc(env(safe-area-inset-top) + 84px);left:0;right:0;text-align:center;font-size:18px;opacity:0;transition:opacity .35s;padding:0 20px}
  #vig{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:inset 0 0 90px 30px rgba(255,30,30,.55)}
  #joyBase,#joyKnob{position:fixed;border-radius:50%;display:none;pointer-events:none;transform:translate(-50%,-50%)}
  #joyBase{width:112px;height:112px;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55)}
  #joyKnob{width:52px;height:52px;background:rgba(255,255,255,.7);box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(190,215,240,.55);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:20;text-align:center;padding:24px;color:#fff}
  .overlay h1{margin:0;font-size:44px;line-height:1;letter-spacing:1px;text-shadow:0 4px 0 #1b4f8f,0 0 18px rgba(0,0,0,.25)}
  .overlay h1 small{display:block;font-size:20px;letter-spacing:6px;margin-bottom:6px;color:#ffe9a8}
  .overlay p{max-width:310px;font-size:16px;line-height:1.35;font-weight:700;text-shadow:0 2px 0 rgba(20,50,90,.5);margin:18px 0 22px}
  .btn{font:800 22px inherit;font-family:inherit;color:#fff;background:linear-gradient(#5bd96a,#2fae42);border:0;border-bottom:5px solid #1b7c2a;
    border-radius:16px;padding:14px 42px;text-shadow:0 2px 0 rgba(0,0,0,.3);margin:6px;min-width:220px}
  .btn:active{transform:translateY(3px);border-bottom-width:2px}
  .btn.alt{background:linear-gradient(#6fa8ee,#3a78d0);border-bottom-color:#25508f;font-size:18px}
  .btn.red{background:linear-gradient(#ee7a7a,#d04040);border-bottom-color:#8f2525;font-size:16px;min-width:180px;padding:10px}
  #a2hs{display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;font-size:13px;font-weight:700;
    background:rgba(18,30,48,.7);border-radius:12px;padding:10px 12px;color:#fff;text-align:center}
  #menu{display:none;z-index:30}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="vig"></div>

<div class="ui" id="top">
  <div class="pill"><div class="bill">$</div><span id="cash">0</span></div>
  <button id="gear" aria-label="Menu">⚙️</button>
</div>
<div class="ui" id="waveBox"><div id="waveTxt">WAVE 0</div><div id="waveBar"><div id="waveFill"></div></div></div>
<div class="ui" id="hint"></div>
<div class="ui pill" id="carryBox">🥩 <span id="carry">0/10</span></div>
<div class="ui" id="hpWrap"><div id="hpFill"></div></div>
<div id="joyBase"></div><div id="joyKnob"></div>

<div class="overlay" id="start">
  <h1><small>SURVIVE THE</small>FROSTBITE<br>OUTPOST</h1>
  <p>Drag anywhere to move. Your spinning axes cut down polar bears. Carry the meat to the cauldron, grab the cash, and build your base.</p>
  <button class="btn" id="playBtn">TAP TO PLAY</button>
  <div id="a2hs">Install: tap <b>Share</b> → <b>Add to Home Screen</b> for fullscreen play.</div>
</div>

<div class="overlay" id="menu">
  <h1>PAUSED</h1>
  <p></p>
  <button class="btn" id="resume">RESUME</button>
  <button class="btn alt" id="sound">🔊 Sound: on</button>
  <button class="btn red" id="reset">Reset progress</button>
</div>
